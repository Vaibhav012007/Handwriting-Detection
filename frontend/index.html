<!doctype html><title>Prescription Review Dashboard</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font:16px system-ui;max-width:900px;margin:2rem auto;padding:0 1rem}button{padding:.5rem}#message{padding:.7rem;background:#f5f5f5}.candidate{border:1px solid #bbb;margin:.8rem 0;padding:.8rem}small{color:#555}</style>
<h1>Prescription review</h1><p>Upload a word-crop image. Candidate identity requires human review.</p>
<input id="image" type="file" accept="image/png,image/jpeg,image/webp"><button id="recognize">Recognize</button><p id="message">Awaiting image.</p><section id="output"></section>
<script>
const message=document.querySelector('#message'),out=document.querySelector('#output'),esc=s=>String(s??'unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let previewUrl=null;
async function evidence(id,box){let r=await fetch(`/medicines/${encodeURIComponent(id)}/evidence`);box.innerHTML=`<pre>${esc(JSON.stringify(await r.json(),null,2))}</pre>`}
function render(data){let r=data.recognition,preview=previewUrl?`<section><img src="${previewUrl}" alt="Uploaded prescription word crop" style="display:block;max-width:100%;height:auto"><strong>Recognized Text</strong><br>${esc(r?.original_text??'Unavailable')}</section>`:'';message.textContent=`OCR: ${r.original_text} (${(r.ocr_confidence*100).toFixed(1)}%). ${r.review_required?'Human review required: '+r.review_reasons.join(', '):'Review status pending.'}`;if(!r.candidates.length){out.innerHTML=preview+'<p>No candidate was returned. The catalog may be unavailable/unpopulated, or contain no sufficiently similar entry.</p>';return}out.innerHTML=preview+'<h2>Candidates</h2>'+r.candidates.map((c,i)=>`<article class="candidate"><strong>${esc(c.canonical_name)}</strong> <small>${esc(c.medicine_id)}</small><br>OCR confidence: ${(r.ocr_confidence*100).toFixed(1)}% · Text similarity: ${c.text_similarity}% · Rank: ${c.ranking_score}%<br>Ingredient: ${esc(c.ingredients.join(', '))} · Strength: ${esc(c.strength_value)} ${esc(c.strength_unit)} · Form: ${esc(c.dosage_form)}<br><small>Match: ${esc(c.match_kind)}; strength: ${esc(c.strength_consistency)}; form: ${esc(c.form_consistency)}</small><br><button data-id="${esc(c.medicine_id)}">Show graph evidence</button><div id="ev${i}"></div></article>`).join('');document.querySelectorAll('[data-id]').forEach((b,i)=>b.onclick=()=>evidence(b.dataset.id,document.querySelector('#ev'+i)))}
document.querySelector('#recognize').onclick=async()=>{let file=image.files[0];if(!file){message.textContent='Choose an image first.';return}if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=URL.createObjectURL(file);message.textContent='Recognizing…';out.innerHTML='';let body=new FormData();body.append('image',file);try{let res=await fetch('/prescriptions',{method:'POST',body});let data=await res.json();if(!res.ok)throw new Error(data.detail||'Recognition failed');render(data)}catch(e){message.textContent='Error: '+e.message}};window.addEventListener('beforeunload',()=>{if(previewUrl)URL.revokeObjectURL(previewUrl)});
</script>
